name: Question
description: Ask a question or request help
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question? Let's get it answered!

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
      placeholder: Describe your question...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any additional context that might help answer your question.
    validations:
      required: false

  - type: textarea
    id: what-you-tried
    attributes:
      label: What You've Tried
      description: If applicable, describe what you've already tried.
    validations:
      required: false
